name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # 六段门禁（与本地 verify.sh 完全一致；xvlog 相关正确性由 fixture 回归在单测段覆盖）
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: bash verify.sh

  # 打 tag（v*）→ 跑门禁 → 自动创建 Release 并挂 vsix（发版零手工）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: bash verify.sh
      - name: 创建 Release 并挂 vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/verikit.vsix \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
